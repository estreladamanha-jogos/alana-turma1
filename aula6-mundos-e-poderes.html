<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fagulha — Queda entre Mundos</title>
<style>
  html, body { margin: 0; height: 100%; background: #05050f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(96vw, calc(96vh * 420 / 640)); height: auto; background: #0a0a18; border-radius: 12px; box-shadow: 0 0 30px rgba(140,90,255,.35); }
</style>
</head>
<body>
<canvas id="game" width="420" height="640"></canvas>
<script>
/* Fagulha: um ET fofo e esquisito (cabeça grande, olhos enormes, orelhas de folha, braços e pernas compridos).
   o = { vx: -1..1 (inclinação), glow: cor da luz do peito (null = apagada), hit: true, alpha, pose: 'fall' | 'stand' | 'cheer' } */
function drawFagulha(c, x, y, s, t, o) {
  o = o || {};
  const glow = o.glow === undefined ? '#ffe9a8' : o.glow;
  const pose = o.pose || 'fall';
  const hit = !!o.hit;
  const sw = Math.sin(t * 7), sw2 = Math.sin(t * 7 + 1.9);
  const blink = (t % 3.4) > 3.27 ? 0.12 : 1;
  const ear = Math.sin(t * 3.2) * 5;
  const skinL = o.metal ? '#c9d0d4' : (hit ? '#f0c4c4' : '#d3cdf0');
  const skinD = o.metal ? '#8b959b' : (hit ? '#d99a9a' : '#9a91c4');
  const line = o.metal ? '#2b2f33' : '#2b2350';
  c.save(); c.translate(x, y); c.scale(s, s);
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.rotate((o.vx || 0) * 0.16);
  c.lineJoin = 'round'; c.lineCap = 'round';

  const P = { fall: [32, 78, 78, 12], stand: [-62, -78, -82, -6], cheer: [62, 88, 78, 8] }[pose];
  // ---- pernas (atrás do corpo) ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const hx = sd * 8, hy = 38;
    const kx = hx + sd * (5 + P[3] * .3) + ph * 3, ky = hy + 32;
    const fx = kx + sd * 3 + ph * (pose === 'fall' ? 9 : 2), fy = ky + 34;
    c.strokeStyle = line; c.lineWidth = 11; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.strokeStyle = skinD; c.lineWidth = 7; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.lineTo(fx, fy); c.stroke();
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2;
    c.beginPath(); c.ellipse(fx + sd * 4, fy + 3, 12, 5.5, sd * -.12, 0, 7); c.fill(); c.stroke();
  }
  // ---- corpo ----
  const gb = c.createLinearGradient(0, -6, 0, 46); gb.addColorStop(0, skinL); gb.addColorStop(1, skinD);
  c.fillStyle = gb; c.strokeStyle = line; c.lineWidth = 2.4;
  c.beginPath(); c.moveTo(-9, -8); c.bezierCurveTo(-20, 4, -20, 34, -9, 44); c.lineTo(9, 44); c.bezierCurveTo(20, 34, 20, 4, 9, -8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, 26, 9, 13, 0, 0, 7); c.fill();
  // luz do peito (a "fagulha")
  if (glow) {
    const r = 9 + Math.sin(t * 5) * 1.6, g = c.createRadialGradient(0, 8, 0, 0, 8, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(.25, glow); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, 8, r * 2.2, 0, 7); c.fill();
  }
  // ---- braços ----
  for (const sd of [-1, 1]) {
    const ph = sd === -1 ? sw : sw2;
    const a1 = (P[0] + ph * (pose === 'fall' ? 16 : 5)) * Math.PI / 180, a2 = (P[1] + ph * (pose === 'fall' ? 18 : 6)) * Math.PI / 180;
    const sx = sd * 14, sy = 4;
    const ex = sx + sd * 30 * Math.cos(a1), ey = sy - 30 * Math.sin(a1);
    const hx = ex + sd * 32 * Math.cos(a2), hy = ey - 32 * Math.sin(a2);
    c.strokeStyle = line; c.lineWidth = 9; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    c.strokeStyle = skinL; c.lineWidth = 5.4; c.beginPath(); c.moveTo(sx, sy); c.lineTo(ex, ey); c.lineTo(hx, hy); c.stroke();
    // três dedos compridos
    const dir = Math.atan2(hy - ey, hx - ex);
    for (const k of [-.55, 0, .55]) {
      const fx = hx + Math.cos(dir + k) * 13, fy = hy + Math.sin(dir + k) * 13;
      c.strokeStyle = line; c.lineWidth = 4.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
      c.strokeStyle = skinL; c.lineWidth = 2.2; c.beginPath(); c.moveTo(hx, hy); c.lineTo(fx, fy); c.stroke();
    }
  }
  // ---- pescoço ----
  c.fillStyle = skinD; c.fillRect(-5, -14, 10, 10);
  // ---- orelhas ----
  for (const sd of [-1, 1]) {
    c.fillStyle = skinD; c.strokeStyle = line; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(sd * 27, -64); c.bezierCurveTo(sd * 46, -70 - ear * .5, sd * 66, -88 - ear, sd * 76, -92 - ear);
    c.bezierCurveTo(sd * 70, -66, sd * 54, -40, sd * 30, -38); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = hit ? '#e8a0a0' : '#eeaacb';
    c.beginPath(); c.moveTo(sd * 32, -60); c.bezierCurveTo(sd * 48, -66 - ear * .4, sd * 60, -80 - ear * .8, sd * 68, -84 - ear * .8);
    c.bezierCurveTo(sd * 62, -64, sd * 50, -46, sd * 34, -44); c.closePath(); c.fill();
  }
  // ---- cabeça ----
  const gh = c.createLinearGradient(0, -80, 0, -4); gh.addColorStop(0, skinL); gh.addColorStop(1, skinD);
  c.fillStyle = gh; c.strokeStyle = line; c.lineWidth = 2.6;
  c.beginPath(); c.moveTo(0, -82); c.bezierCurveTo(34, -82, 42, -50, 24, -22); c.bezierCurveTo(16, -10, 7, -5, 0, -5);
  c.bezierCurveTo(-7, -5, -16, -10, -24, -22); c.bezierCurveTo(-42, -50, -34, -82, 0, -82); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.ellipse(-8, -70, 12, 6, -.4, 0, 7); c.fill();
  // ---- olhos enormes ----
  const look = (o.vx || 0) * 3;
  for (const sd of [-1, 1]) {
    c.save(); c.translate(sd * 15, -44); c.rotate(sd * .22);
    if (hit) {
      c.strokeStyle = line; c.lineWidth = 3.4; c.beginPath(); c.moveTo(-8, -8); c.lineTo(8, 8); c.moveTo(8, -8); c.lineTo(-8, 8); c.stroke();
    } else {
      c.scale(1, blink);
      const ge = c.createRadialGradient(-2, -4, 1, 0, 0, 16); ge.addColorStop(0, '#3a3560'); ge.addColorStop(1, '#0a0716');
      c.fillStyle = ge; c.beginPath(); c.ellipse(0, 0, 11.5, 15, 0, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(-3.5 + look, -6, 3.6, 4.6, 0, 0, 7); c.fill();
      c.beginPath(); c.arc(3.5 + look * .6, 6, 1.9, 0, 7); c.fill();
    }
    c.restore();
  }
  // ---- nariz e boca ----
  c.fillStyle = line; c.beginPath(); c.arc(-2.4, -24, 1.1, 0, 7); c.arc(2.4, -24, 1.1, 0, 7); c.fill();
  c.strokeStyle = line; c.lineWidth = 2; c.beginPath();
  if (hit) c.ellipse(0, -15, 3, 4, 0, 0, 7); else { c.moveTo(-5, -17); c.quadraticCurveTo(0, -12.5, 5, -17); }
  c.stroke();
  c.restore();
}

/* ================= JOGO: FAGULHA — QUEDA ENTRE MUNDOS ================= */
const cv = document.getElementById('game'), c = cv.getContext('2d');
if (!c.roundRect) c.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };   // navegadores antigos
const W = 420, H = 640;
const PY = 190;                 // altura fixa do Fagulha na tela (o cenário é que sobe)
const BASE_V = 230;             // velocidade da queda (pixels por segundo)
const META = 1250;              // metros até vencer (1250m = 5 mundos de 250m)
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

let estado = 'inicio';          // inicio | jogando | gameover | vitoria
let t = 0, dist = 0, vel = BASE_V;
let vidas = 3, invenc = 0, cristais = 0, shake = 0;
const jog = { x: W / 2, vx: 0, dir: 1 };
let obst = [], gems = [], fx = [];
let spawnT = 1, gemT = 1;
const keys = { left: false, right: false };

/* ---------- mundos ---------- */
const WORLDS = [
  { name: 'FLORESTA ASSOMBRADA',            top: '#1c2e1a', mid: '#16241a', bottom: '#0a140c', ring: '#8fd48f' },
  { name: 'GELEIRA ASSOMBRADA',             top: '#3a5570', mid: '#25384d', bottom: '#131f2c', ring: '#bfe8ff' },
  { name: 'VULCÃO DO PESADELO',             top: '#7a3318', mid: '#5c1c10', bottom: '#2c0906', ring: '#ff9a4d' },
  { name: 'ESPAÇO DAS ESTRELAS FANTASMAS',  top: '#241a42', mid: '#170f2c', bottom: '#0a0616', ring: '#c9a8ff' },
  { name: 'TORNADO',                        top: '#6b7480', mid: '#4a525c', bottom: '#262b30', ring: '#dfe6ea' }
];
let worldIdx = 0, worldNameT = 0;
let amb = [], ambT = .4, ufo = null, ufoT = rnd(6, 12);
let portal = null, proximoLimite = 250;   // portal = { y, targetWorld, t, cruzado }
let flashT = 0;

/* ---------- poderes ---------- */
const DASH_CD_MAX = 3, WIND_CD_MAX = 4.5, DASH_DUR = .22;
const SHIELD_CD_MAX = 8, SHIELD_DUR = 5;
let dashCD = 0, dashing = false, dashT = 0, dashDir = 1;
let windCD = 0, windGustT = 0, windFailT = 0;
let shieldCD = 0, shieldActive = false, shieldT = 0;
const ANCORA_CD_MAX = 9, ANCORA_DUR = 3;
let ancoraCD = 0, ancoraActive = false, ancoraT = 0;
let poderSel = 'dash';

/* ---------- mundo do tornado: vento lateral que troca de lado a cada 5s ---------- */
let tornadoDir = 1, tornadoT = 5;

function resetar() {
  estado = 'jogando'; t = 0; dist = 0; vidas = 3; invenc = 0; cristais = 0; shake = 0;
  jog.x = W / 2; jog.vx = 0; obst = []; gems = []; fx = []; spawnT = 1; gemT = 1;
  worldIdx = 0; worldNameT = 0; amb = []; ambT = .4; ufo = null; ufoT = rnd(6, 12);
  portal = null; proximoLimite = 250; flashT = 0;
  dashCD = 0; dashing = false; dashT = 0; dashDir = 1;
  windCD = 0; windGustT = 0; windFailT = 0;
  shieldCD = 0; shieldActive = false; shieldT = 0; poderSel = 'dash';
  ancoraCD = 0; ancoraActive = false; ancoraT = 0;
  tornadoDir = 1; tornadoT = 5;
}

/* ---------- poderes: dash, vento e escudo (Q troca, ESPAÇO ativa) ---------- */
function cyclePoder() {
  const ordem = ['dash', 'vento', 'escudo', 'ancora'];
  poderSel = ordem[(ordem.indexOf(poderSel) + 1) % ordem.length];
}
function ativarPoder() {
  if (poderSel === 'dash') tryDash();
  else if (poderSel === 'vento') tryWind();
  else if (poderSel === 'escudo') tryShield();
  else tryAncora();
}
function tryDash() {
  if (dashCD > 0 || dashing) return;
  dashDir = keys.left ? -1 : keys.right ? 1 : jog.dir;
  dashing = true; dashT = DASH_DUR; dashCD = DASH_CD_MAX;
  burst(jog.x, PY, '#ffe9a8', 14, 200);
}
function tryWind() {
  if (windCD > 0) return;
  windCD = WIND_CD_MAX;
  windGustT = .5;
  if (worldIdx === 3) { windFailT = 1.2; return; }
  for (const o of obst) {
    if (o.flung || o.morto) continue;
    o.flung = true;
    o.fvx = (Math.random() < .5 ? -1 : 1) * rnd(220, 340);
    o.fvy = rnd(160, 300);
    o.frot = 0; o.frotv = rnd(-8, 8);
  }
}
function tryShield() {
  if (shieldCD > 0 || shieldActive) return;
  shieldActive = true; shieldT = SHIELD_DUR; shieldCD = SHIELD_CD_MAX;
  burst(jog.x, PY, '#b18cff', 14, 180);
}
function tryAncora() {
  if (ancoraCD > 0 || ancoraActive) return;
  ancoraActive = true; ancoraT = ANCORA_DUR; ancoraCD = ANCORA_CD_MAX;
  burst(jog.x, PY, '#c9d0d4', 14, 170);
}

/* ---------- obstáculos: um tipo diferente por mundo ---------- */
const OBST_TIPO = ['lixo', 'boneco', 'fantasmaFogo', 'estrelaFantasma'];
function criarObstaculo() {
  obst.push({ tp: OBST_TIPO[worldIdx], x: rnd(50, W - 50), y: H + 40, w: rnd(50, 74), h: rnd(46, 62), sd: Math.random(), seed: rnd(0, 6.283) });
}

function desenharObstaculo(o) {
  c.save(); c.translate(o.x, o.y);
  if (o.flung) c.rotate(o.frot);
  if (o.tp === 'lixo') {
    // sacos de lixo jogados na floresta
    c.fillStyle = '#3a3f46'; c.strokeStyle = '#1c1f24'; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(-o.w * .4, o.h * .5); c.quadraticCurveTo(-o.w * .55, -o.h * .1, -o.w * .18, -o.h * .5);
    c.quadraticCurveTo(0, -o.h * .62, o.w * .2, -o.h * .48); c.quadraticCurveTo(o.w * .55, -o.h * .05, o.w * .4, o.h * .5);
    c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-o.w * .18, -o.h * .3); c.lineTo(o.w * .12, o.h * .3); c.stroke();
    c.fillStyle = '#8fa03a';
    c.beginPath(); c.ellipse(-o.w * .1, o.h * .18, 8, 5, .5, 0, 7); c.fill();
    c.fillStyle = '#c0392b';
    c.beginPath(); c.rect(-6, -o.h * .58, 12, 8); c.fill();
  } else if (o.tp === 'boneco') {
    // boneco de neve com cara de terror
    c.fillStyle = '#eef6fb'; c.strokeStyle = '#9db6c4'; c.lineWidth = 2;
    c.beginPath(); c.arc(0, o.h * .28, o.w * .32, 0, 7); c.fill(); c.stroke();
    c.beginPath(); c.arc(0, -o.h * .12, o.w * .24, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = '#3a2a1a'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(-o.w * .24, -o.h * .2); c.lineTo(-o.w * .5, -o.h * .38); c.stroke();
    c.beginPath(); c.moveTo(o.w * .24, -o.h * .2); c.lineTo(o.w * .5, -o.h * .02); c.stroke();
    c.fillStyle = '#e63946';
    for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(0, o.h * .12 + i * 12, 3, 0, 7); c.fill(); }
    // rosto de terror
    c.fillStyle = '#111';
    c.beginPath(); c.moveTo(-o.w * .13, -o.h * .18); c.lineTo(-o.w * .02, -o.h * .1); c.lineTo(-o.w * .13, -o.h * .02); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(o.w * .13, -o.h * .18); c.lineTo(o.w * .02, -o.h * .1); c.lineTo(o.w * .13, -o.h * .02); c.closePath(); c.fill();
    c.fillStyle = '#e67e22';
    c.beginPath(); c.moveTo(0, -o.h * .06); c.lineTo(o.w * .1, -o.h * .01); c.lineTo(0, o.h * .02); c.closePath(); c.fill();
    c.strokeStyle = '#111'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-o.w * .16, o.h * .14); c.lineTo(-o.w * .08, o.h * .06); c.lineTo(0, o.h * .16); c.lineTo(o.w * .08, o.h * .04); c.lineTo(o.w * .16, o.h * .14); c.stroke();
  } else if (o.tp === 'fantasmaFogo') {
    // fantasma de fogo com cara de terror
    const flick = Math.sin(t * 20 + o.seed) * 3;
    for (let i = 0; i < 6; i++) {
      const a = t * 4 + i * 1.1 + o.seed;
      c.globalAlpha = .55; c.fillStyle = i % 2 ? '#ffb238' : '#ff5722';
      c.beginPath(); c.arc(Math.cos(a) * o.w * .3, o.h * .3 + Math.sin(a) * 6 - i * 5, 5 - i * .5, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
    const g = c.createLinearGradient(0, -o.h * .5, 0, o.h * .45);
    g.addColorStop(0, '#ffcf5c'); g.addColorStop(.5, '#ff6a1f'); g.addColorStop(1, '#c0281f');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(0, -o.h * .5 + flick);
    c.quadraticCurveTo(o.w * .42, -o.h * .1, o.w * .3, o.h * .35);
    c.quadraticCurveTo(o.w * .15, o.h * .22, 0, o.h * .45);
    c.quadraticCurveTo(-o.w * .15, o.h * .22, -o.w * .3, o.h * .35);
    c.quadraticCurveTo(-o.w * .42, -o.h * .1, 0, -o.h * .5 + flick);
    c.closePath(); c.fill();
    c.fillStyle = '#1a0800';
    c.beginPath(); c.moveTo(-o.w * .16, -o.h * .12); c.lineTo(-o.w * .02, -o.h * .02); c.lineTo(-o.w * .16, o.h * .08); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(o.w * .16, -o.h * .12); c.lineTo(o.w * .02, -o.h * .02); c.lineTo(o.w * .16, o.h * .08); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(0, o.h * .2, o.w * .12, o.h * .1, 0, 0, 7); c.fill();
  } else {
    // estrela fantasma com cara de terror
    const pulso = 1 + Math.sin(t * 6 + o.seed) * .08;
    c.save(); c.rotate(Math.sin(t * 2 + o.seed) * .2); c.scale(pulso, pulso);
    c.fillStyle = '#e8d9ff'; c.strokeStyle = '#8a6bcf'; c.lineWidth = 2;
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 === 0 ? o.w * .5 : o.w * .22;
      const px = Math.cos(a) * r, py = Math.sin(a) * r * (o.h / o.w);
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#1a1030';
    c.beginPath(); c.moveTo(-o.w * .16, -6); c.lineTo(-o.w * .04, 4); c.lineTo(-o.w * .16, 12); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(o.w * .16, -6); c.lineTo(o.w * .04, 4); c.lineTo(o.w * .16, 12); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(0, o.h * .22, o.w * .1, 5, 0, 0, 7); c.fill();
    c.restore();
  }
  c.restore();
}

/* ---------- partículas ---------- */
function burst(x, y, cor, n, v) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rnd(30, v || 140); fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.3, .7), max: .7, cor, r: rnd(1.5, 3.6) }); }
}

/* ---------- partículas de ambiente por mundo ---------- */
function spawnAmbiente() {
  if (worldIdx === 0) {
    // folhas mortas caindo pelas laterais
    const lado = Math.random() < .5 ? rnd(-10, 70) : rnd(W - 70, W + 10);
    amb.push({ type: 'folha', x: lado, y: -10, vx: rnd(-35, 35), vy: rnd(35, 70), rot: rnd(0, 6.28), rvel: rnd(-2.5, 2.5), size: rnd(7, 13), cor: ['#8a5a2a', '#a06a2a', '#6b3d1f', '#9c7a2a'][Math.floor(rnd(0, 4))] });
  } else if (worldIdx === 1) {
    // neve caindo no fundo
    amb.push({ type: 'neve', x: rnd(0, W), y: -10, vx: rnd(-8, 8), vy: rnd(45, 85), size: rnd(2, 4.5) });
  } else if (worldIdx === 2) {
    // partículas de fogo + mini fantasmas
    amb.push({ type: 'brasa', x: rnd(0, W), y: H + 10, vx: rnd(-14, 14), vy: rnd(-90, -50), size: rnd(2, 4), life: rnd(1, 2.2) });
    if (Math.random() < .05) amb.push({ type: 'fantasminha', x: rnd(35, W - 35), y: rnd(H * .2, H * .65), vx: rnd(-18, 18), vy: rnd(-8, 8), t: 0, size: rnd(13, 20) });
  } else {
    // estrelas fantasma
    amb.push({ type: 'estrelafantasma', x: rnd(0, W), y: -10, vx: rnd(-6, 6), vy: rnd(18, 38), t: 0, size: rnd(3, 6) });
  }
}

function desenharAmbiente() {
  for (const p of amb) {
    if (p.type === 'folha') {
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.cor;
      c.beginPath(); c.moveTo(0, -p.size); c.quadraticCurveTo(p.size, 0, 0, p.size); c.quadraticCurveTo(-p.size, 0, 0, -p.size); c.fill();
      c.restore();
    } else if (p.type === 'neve') {
      c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 7); c.fill();
    } else if (p.type === 'brasa') {
      const al = clamp(p.life / 2.2, 0, 1);
      c.globalAlpha = al; c.fillStyle = '#ff8a3d'; c.beginPath(); c.arc(p.x, p.y, p.size, 0, 7); c.fill();
      c.globalAlpha = 1;
    } else if (p.type === 'fantasminha') {
      c.save(); c.translate(p.x, p.y + Math.sin(p.t * 3) * 4); c.globalAlpha = .55;
      c.fillStyle = '#fff3f3';
      c.beginPath(); c.arc(0, 0, p.size, Math.PI, 0);
      c.lineTo(p.size, p.size * .8);
      for (let i = 0; i < 3; i++) c.lineTo(p.size - (i + 1) * (p.size * 2 / 3), (i % 2 ? p.size * .5 : p.size * .8));
      c.lineTo(-p.size, p.size * .8);
      c.closePath(); c.fill();
      c.fillStyle = '#663333';
      c.beginPath(); c.arc(-p.size * .3, -p.size * .1, p.size * .12, 0, 7); c.arc(p.size * .3, -p.size * .1, p.size * .12, 0, 7); c.fill();
      c.restore(); c.globalAlpha = 1;
    } else if (p.type === 'estrelafantasma') {
      c.save(); c.translate(p.x, p.y); c.globalAlpha = .5 + Math.sin(p.t * 6) * .3;
      c.fillStyle = '#e8d9ff';
      for (let i = 0; i < 4; i++) { c.save(); c.rotate(i * Math.PI / 2); c.fillRect(-p.size / 2, -1, p.size, 2); c.restore(); }
      c.restore(); c.globalAlpha = 1;
    }
  }
}

/* ---------- entrada ---------- */
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(k)) e.preventDefault();
  if (estado !== 'jogando') { if (k === 'Space' || k === 'Enter' || k === 'KeyR') resetar(); return; }
  if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (k === 'Space' && !e.repeat) ativarPoder();
  if (k === 'KeyQ' && !e.repeat) cyclePoder();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
});

/* ---------- atualização ---------- */
function update(dt) {
  if (estado !== 'jogando') return;
  t += dt;
  vel = BASE_V * Math.pow(1.16, worldIdx);
  dist += vel * dt;
  if (invenc > 0) invenc -= dt;
  if (shake > 0) shake -= dt;
  if (flashT > 0) flashT -= dt;
  if (dashCD > 0) dashCD -= dt;
  if (windCD > 0) windCD -= dt;
  if (windGustT > 0) windGustT -= dt;
  if (windFailT > 0) windFailT -= dt;
  if (shieldCD > 0) shieldCD -= dt;
  if (shieldActive) { shieldT -= dt; if (shieldT <= 0) shieldActive = false; }
  if (ancoraCD > 0) ancoraCD -= dt;
  if (ancoraActive) { ancoraT -= dt; if (ancoraT <= 0) ancoraActive = false; }

  // ---- movimento do Fagulha ----
  const ax = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (ax) jog.dir = ax;
  if (dashing) {
    dashT -= dt;
    jog.vx = dashDir * 1400;
    if (dashT <= 0) dashing = false;
  } else {
    jog.vx += (ax * 300 - jog.vx) * Math.min(1, dt * 10);
  }
  if (worldIdx === 4) {
    tornadoT -= dt;
    if (tornadoT <= 0) { tornadoDir *= -1; tornadoT = 5; }
    if (!ancoraActive) jog.vx += tornadoDir * 260 * dt;
  }
  jog.x = clamp(jog.x + jog.vx * dt, 34, W - 34);

  // ---- portal negro: nasce a cada 250 m, o mundo só troca quando o Fagulha o atravessa ----
  const metros = dist / 10;
  if (!portal && proximoLimite <= 1000 && metros >= proximoLimite) {
    const alvo = Math.min(WORLDS.length - 1, Math.floor(proximoLimite / 250));
    portal = { y: H + 70, targetWorld: alvo, t: 0, cruzado: false };
    proximoLimite += 250;
  }
  if (portal) {
    portal.t += dt;
    portal.y -= vel * dt;
    if (!portal.cruzado && portal.y <= PY + 6) {
      portal.cruzado = true;
      worldIdx = portal.targetWorld;
      worldNameT = 2.4;
      flashT = .5;
      burst(W / 2, PY, WORLDS[worldIdx].ring, 46, 240);
    }
    if (portal.y < -150) portal = null;
  }
  if (worldNameT > 0) worldNameT -= dt;

  ambT -= dt;
  if (ambT <= 0) { ambT = worldIdx === 2 ? .07 : .11; spawnAmbiente(); }
  for (const p of amb) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.rot !== undefined) p.rot += p.rvel * dt;
    if (p.t !== undefined) p.t += dt;
    if (p.life !== undefined) p.life -= dt;
  }
  amb = amb.filter(p => p.y > -40 && p.y < H + 40 && (p.life === undefined || p.life > 0));

  if (worldIdx === 3) {
    ufoT -= dt;
    if (!ufo && ufoT <= 0) { ufo = { x: -70, y: rnd(50, 150) }; ufoT = rnd(9, 16); }
    if (ufo) { ufo.x += 65 * dt; if (ufo.x > W + 70) ufo = null; }
  } else ufo = null;

  // ---- obstáculos ----
  spawnT -= dt;
  if (spawnT <= 0) {
    criarObstaculo();
    spawnT = 1.0;
  }
  for (const o of obst) {
    if (o.flung) { o.x += o.fvx * dt; o.y += o.fvy * dt; o.frot += o.frotv * dt; }
    else o.y -= vel * dt;
  }
  obst = obst.filter(o => {
    if (o.morto) return false;
    if (o.flung) return o.y < H + 160 && o.x > -160 && o.x < W + 160;
    return o.y > -80;
  });

  // ---- cristais ----
  gemT -= dt;
  if (gemT <= 0) { gems.push({ x: rnd(40, W - 40), y: H + 30 }); gemT = .75; }
  for (const g of gems) g.y -= vel * dt;
  gems = gems.filter(g => {
    if (Math.abs(g.x - jog.x) < 28 && Math.abs(g.y - (PY + 4)) < 44) { cristais++; burst(g.x, g.y, '#7af6ff', 8, 90); return false; }
    return g.y > -30;
  });

  // ---- colisões ----
  const hb = { x: jog.x - 15, y: PY - 26, w: 30, h: 58 };
  const imune = false;
  for (const o of obst) {
    if (o.morto) continue;
    const ox = o.x - o.w * .42, oy = o.y - o.h * .42, ow = o.w * .84, oh = o.h * .84;
    if (hb.x < ox + ow && hb.x + hb.w > ox && hb.y < oy + oh && hb.y + hb.h > oy) {
      if (shieldActive) { shieldActive = false; o.morto = true; burst(jog.x, PY, '#b18cff', 20, 200); continue; }
      if (imune || invenc > 0 || dashing) continue;
      levarDano(o);
      break;
    }
  }

  // ---- partículas ----
  for (const p of fx) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; }
  fx = fx.filter(p => p.life > 0);

  // ---- fim de jogo ----
  if (dist >= META * 10) { estado = 'vitoria'; }
}

function levarDano(o) {
  vidas--; invenc = 1.5; shake = .3; burst(jog.x, PY, '#ff5577', 16, 180);
  if (o) o.morto = true;
  if (vidas <= 0) estado = 'gameover';
}

/* ---------- desenho ---------- */
function fundo() {
  const wd = WORLDS[worldIdx];
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, wd.top); g.addColorStop(.55, wd.mid); g.addColorStop(1, wd.bottom);
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  if (worldIdx === 3) desenharLua();

  for (let k = -1; k < 8; k++) {
    const y = k * 100 - (dist % 100);
    if (worldIdx === 0) drawTroncoLado(y);
    else if (worldIdx === 1) drawMontanhaLado(y);
    else if (worldIdx === 2) drawPedraLado(y);
    else drawCascoLado(y);
  }

  desenharAmbiente();
  if (worldIdx === 3 && ufo) desenharUfo();
}

function desenharPortal(p) {
  const wd = WORLDS[p.targetWorld];
  const y = p.y, pulso = 1 + Math.sin(p.t * 5) * .06;

  // névoa colorida ao redor do portal
  const halo = c.createRadialGradient(W / 2, y, 20, W / 2, y, 175 * pulso);
  halo.addColorStop(0, hexA(wd.ring, .32)); halo.addColorStop(1, hexA(wd.ring, 0));
  c.fillStyle = halo; c.fillRect(0, y - 190, W, 380);

  c.save(); c.translate(W / 2, y); c.scale(1, .34);
  const rx = 168 * pulso, rIn = rx * .74;

  // anel externo brilhante
  const grOut = c.createRadialGradient(0, 0, rx * .6, 0, 0, rx);
  grOut.addColorStop(0, 'rgba(0,0,0,0)'); grOut.addColorStop(.75, hexA(wd.ring, .95)); grOut.addColorStop(1, hexA(wd.ring, 0));
  c.fillStyle = grOut; c.beginPath(); c.arc(0, 0, rx, 0, 7); c.fill();

  // vórtice negro (o "portão")
  const grIn = c.createRadialGradient(0, 0, 4, 0, 0, rIn);
  grIn.addColorStop(0, '#000'); grIn.addColorStop(.7, '#050008'); grIn.addColorStop(1, hexA(wd.ring, .6));
  c.fillStyle = grIn; c.beginPath(); c.arc(0, 0, rIn, 0, 7); c.fill();

  // espirais girando dentro do portal
  c.strokeStyle = hexA(wd.ring, .8); c.lineWidth = 3;
  for (let i = 0; i < 3; i++) {
    c.save(); c.rotate(p.t * 2 + i * 2.094);
    c.beginPath();
    for (let a = 0; a < 6.283; a += .25) { const rr = (a / 6.283) * rIn, xx = Math.cos(a) * rr, yy = Math.sin(a) * rr; if (a === 0) c.moveTo(xx, yy); else c.lineTo(xx, yy); }
    c.stroke(); c.restore();
  }
  c.restore();

  // raios saindo da borda
  c.strokeStyle = hexA(wd.ring, .9); c.lineWidth = 2.4;
  for (let i = 0; i < 8; i++) {
    if (Math.sin(p.t * 9 + i * 3) > .8) {
      const ang = (i / 8) * 6.283 + p.t;
      const x1 = W / 2 + Math.cos(ang) * 150, y1 = y + Math.sin(ang) * 46;
      const x2 = W / 2 + Math.cos(ang) * 178, y2 = y + Math.sin(ang) * 56;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
    }
  }

  // partículas sendo sugadas pro portal
  for (let i = 0; i < 12; i++) {
    const a = p.t * 3 + i * .52, d = 55 + (i * 13 + p.t * 46) % 105;
    const px = W / 2 + Math.cos(a) * d, py = y + Math.sin(a) * d * .34;
    c.fillStyle = hexA(wd.ring, clamp(1 - d / 115, 0, 1));
    c.beginPath(); c.arc(px, py, 2.6, 0, 7); c.fill();
  }
}
function desenharNomeMundo() {
  if (worldNameT <= 0) return;
  const al = clamp(Math.min(1, worldNameT / 1.4), 0, 1);
  c.save(); c.globalAlpha = al;
  texto(WORLDS[worldIdx].name, W / 2, H / 2 - 60, 14, WORLDS[worldIdx].ring);
  c.restore();
}

function desenhar() {
  c.save();
  if (shake > 0) c.translate(rnd(-5, 5), rnd(-5, 5));
  fundo();

  for (const g of gems) {
    c.save(); c.translate(g.x, g.y); c.rotate(Math.sin(t * 3 + g.x) * .3);
    c.fillStyle = '#7af6ff'; c.beginPath(); c.moveTo(0, -11); c.lineTo(8, 0); c.lineTo(0, 11); c.lineTo(-8, 0); c.closePath(); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-1, -8); c.lineTo(3, -1); c.lineTo(-3, -1); c.fill(); c.restore();
  }
  for (const o of obst) desenharObstaculo(o);
  if (portal) desenharPortal(portal);

  // ---- o Fagulha ----
  const piscando = invenc > 0 && Math.floor(t * 14) % 2 === 0;
  if (estado !== 'gameover') {
    drawFagulha(c, jog.x, PY + 12, .42, t, {
      vx: clamp(jog.vx / 300, -1, 1), hit: invenc > 1.2,
      alpha: piscando ? .3 : 1, metal: ancoraActive,
      glow: ancoraActive ? '#c9d0d4' : PODERES_INFO[poderSel].cor });
  }
  if (shieldActive) {
    c.save();
    c.globalAlpha = .55 + Math.sin(t * 8) * .1;
    const bg = c.createRadialGradient(jog.x, PY, 5, jog.x, PY, 46);
    bg.addColorStop(0, 'rgba(177,140,255,0)'); bg.addColorStop(.7, 'rgba(177,140,255,.35)'); bg.addColorStop(1, 'rgba(200,170,255,.05)');
    c.fillStyle = bg; c.beginPath(); c.arc(jog.x, PY, 46, 0, 7); c.fill();
    c.strokeStyle = '#b18cff'; c.lineWidth = 2.4; c.beginPath(); c.arc(jog.x, PY, 44, 0, 7); c.stroke();
    c.restore();
  }
  for (const p of fx) { c.globalAlpha = clamp(p.life / p.max, 0, 1); c.fillStyle = p.cor; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  desenharNomeMundo();
  c.restore();
  if (windGustT > 0) {
    c.save(); c.globalAlpha = clamp(windGustT / .5, 0, 1) * .5;
    c.strokeStyle = '#bfe8ff'; c.lineWidth = 3;
    for (let i = 0; i < 10; i++) {
      const x = (i * 47 + t * 400) % (W + 80) - 40;
      c.beginPath(); c.moveTo(x, -10); c.lineTo(x - 30, H + 10); c.stroke();
    }
    c.restore();
  }
  if (flashT > 0) { c.fillStyle = `rgba(255,255,255,${clamp(flashT / .5, 0, 1)})`; c.fillRect(0, 0, W, H); }
  hud();
  telas();
}

/* ---------- HUD e telas ---------- */
function texto(txt, x, y, tam, cor, al) {
  c.font = `${tam}px 'Press Start 2P', monospace`; c.textAlign = al || 'center'; c.textBaseline = 'middle';
  c.lineWidth = Math.max(3, tam / 4); c.strokeStyle = '#0a0a18'; c.strokeText(txt, x, y); c.fillStyle = cor; c.fillText(txt, x, y);
}
function hud() {
  if (estado === 'inicio') return;
  c.font = '20px sans-serif'; c.textAlign = 'left'; c.textBaseline = 'middle';
  for (let i = 0; i < 3; i++) c.fillText(i < vidas ? '❤️' : '🖤', 12 + i * 26, 22);
  texto('💎 ' + cristais, W - 14, 22, 12, '#7af6ff', 'right');
  const pr = clamp(dist / (META * 10), 0, 1);
  c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(W - 14, 44, 6, 140);
  c.fillStyle = '#7CFF9E'; c.fillRect(W - 14, 44, 6, 140 * pr);
  texto(Math.floor(dist / 10) + ' m', W - 11, 196, 8, '#fff', 'right');
  if (estado === 'jogando') { desenharPoderes(); desenharAvisoTornado(); }
}

/* ---------- aviso de vento do tornado (topo da tela) ---------- */
function desenharAvisoTornado() {
  if (worldIdx !== 4) return;
  const y = 40, piscar = tornadoT < 1.2;
  c.save();
  c.globalAlpha = piscar ? (.4 + Math.sin(t * 20) * .4) : .85;
  c.fillStyle = '#dfe6ea';
  for (let i = 0; i < 3; i++) {
    const x = W / 2 + tornadoDir * (i * 18 - 18);
    c.beginPath();
    if (tornadoDir > 0) { c.moveTo(x - 9, y - 9); c.lineTo(x + 9, y); c.lineTo(x - 9, y + 9); }
    else { c.moveTo(x + 9, y - 9); c.lineTo(x - 9, y); c.lineTo(x + 9, y + 9); }
    c.closePath(); c.fill();
  }
  c.restore();
}

const PODERES_INFO = {
  dash: { label: 'DASH', cor: '#ffe9a8', draw: drawIconDash },
  vento: { label: 'VENTO', cor: '#7af6ff', draw: drawIconWind },
  escudo: { label: 'ESCUDO', cor: '#b18cff', draw: drawIconEscudo },
  ancora: { label: 'ÂNCORA', cor: '#c9d0d4', draw: drawIconAncora }
};
function desenharPoderes() {
  const y = H - 34;
  const itens = [
    { key: 'dash', x: W / 2 - 111, cd: dashCD, max: DASH_CD_MAX },
    { key: 'vento', x: W / 2 - 37, cd: windCD, max: WIND_CD_MAX },
    { key: 'escudo', x: W / 2 + 37, cd: shieldCD, max: SHIELD_CD_MAX },
    { key: 'ancora', x: W / 2 + 111, cd: ancoraCD, max: ANCORA_CD_MAX }
  ];
  for (const it of itens) {
    const info = PODERES_INFO[it.key];
    const ativo = poderSel === it.key;
    const raio = ativo ? 24 : 20;
    c.save(); c.translate(it.x, y);
    c.fillStyle = ativo ? 'rgba(255,255,255,.16)' : 'rgba(10,10,24,.6)';
    c.beginPath(); c.arc(0, 0, raio, 0, 7); c.fill();
    c.strokeStyle = ativo ? info.cor : 'rgba(255,255,255,.25)'; c.lineWidth = ativo ? 3 : 2; c.stroke();
    info.draw();
    if (it.cd > 0) {
      const frac = it.cd / it.max;
      c.fillStyle = 'rgba(0,0,0,.65)';
      c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, raio, -Math.PI / 2, -Math.PI / 2 + frac * 6.283); c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.font = 'bold 10px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(it.cd.toFixed(1), 0, 0);
    }
    c.restore();
    c.fillStyle = ativo ? info.cor : '#fff'; c.font = (ativo ? 'bold ' : '') + '9px sans-serif'; c.textAlign = 'center';
    c.fillText(info.label, it.x, y + 32);
  }
  c.fillStyle = '#fff'; c.font = '9px sans-serif'; c.textAlign = 'center';
  c.fillText('Q troca · ESPAÇO usa', W / 2, y - 34);
  if (windFailT > 0) {
    c.save(); c.globalAlpha = clamp(windFailT / 1.2, 0, 1);
    texto('SEM AR NO ESPAÇO!', W / 2, y - 50, 8, '#ff9a4d');
    c.restore();
  }
}

function telas() {
  if (estado === 'inicio') {
    c.fillStyle = 'rgba(5,5,20,.72)'; c.fillRect(0, 0, W, H);
    texto('FAGULHA', W / 2, 150, 34, '#ffe9a8');
    texto('QUEDA ENTRE MUNDOS', W / 2, 200, 12, '#7af6ff');
    drawFagulha(c, W / 2, 345, .9, performance.now() / 1000, { pose: 'stand' });
    if (Math.floor(performance.now() / 500) % 2) texto('APERTE ESPAÇO', W / 2, 520, 14, '#fff');
  } else if (estado === 'gameover') {
    c.fillStyle = 'rgba(30,0,10,.78)'; c.fillRect(0, 0, W, H);
    texto('GAME OVER', W / 2, 220, 30, '#ff3355');
    texto('💎 ' + cristais + '   ⬇ ' + Math.floor(dist / 10) + ' m', W / 2, 290, 12, '#fff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 400, 11, '#fff');
  } else if (estado === 'vitoria') {
    c.fillStyle = 'rgba(0,20,10,.78)'; c.fillRect(0, 0, W, H);
    texto('CHEGOU AO FUNDO!', W / 2, 170, 20, '#7CFF9E');
    drawFagulha(c, W / 2, 300, .95, performance.now() / 1000, { pose: 'cheer', glow: '#7CFF9E' });
    texto('💎 ' + cristais, W / 2, 470, 16, '#7af6ff');
    if (Math.floor(performance.now() / 500) % 2) texto('ESPAÇO: JOGAR DE NOVO', W / 2, 540, 11, '#fff');
  }
}

/* ---------- laço principal ---------- */
let ultimo = performance.now(), fimT = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(.033, (now - ultimo) / 1000)); ultimo = now;
  try {
  if (estado === 'inicio') t += dt;
  update(dt);
  desenhar();
  } catch (e) { console.error('Erro no jogo:', e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
